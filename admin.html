<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | Gold Nomerlar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #3d2c00, transparent 35%),
        radial-gradient(circle at 90% 90%, #302000, transparent 35%),
        #050505;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    /* ================= HEADER ================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 20px;

      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,193,7,.2);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 15px 50px rgba(0,0,0,.35);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .header-logo {
      width: 52px;
      height: 52px;
      min-width: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          #ffad00
        );

      font-size: 26px;

      box-shadow:
        0 0 25px rgba(255,193,7,.2);
    }

    .header h1 {
      color: #ffd54a;
      font-size: 21px;
    }

    .header p {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .logout {
      padding: 10px 16px;

      border-radius: 10px;
      border: 1px solid #ffd54a;

      background: transparent;
      color: #ffd54a;

      cursor: pointer;
      white-space: nowrap;

      transition: .2s;
    }

    .logout:hover {
      background: #ffd54a;
      color: #111;
    }


    /* ================= GRID ================= */

    .grid {
      display: grid;

      grid-template-columns:
        380px 1fr;

      gap: 20px;
    }


    /* ================= CARD ================= */

    .card {
      padding: 25px;

      border-radius: 20px;

      background: rgba(255,255,255,.05);

      border: 1px solid rgba(255,193,7,.2);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 15px 50px rgba(0,0,0,.25);
    }

    .card h2 {
      color: #ffd54a;

      font-size: 20px;

      margin-bottom: 20px;
    }


    /* ================= INPUT ================= */

    label {
      display: block;

      color: #aaa;

      font-size: 13px;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border-radius: 12px;

      border: 1px solid #444;

      background: #111;

      color: white;

      outline: none;

      font-size: 15px;

      margin-bottom: 15px;

      transition: .2s;
    }

    input::placeholder {
      color: #666;
    }

    input:focus {
      border-color: #ffd54a;

      box-shadow:
        0 0 12px rgba(255,213,74,.15);
    }


    /* ================= CREATE BUTTON ================= */

    .create-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          #ffad00
        );

      color: #111;

      font-weight: bold;

      font-size: 15px;

      cursor: pointer;

      transition: .2s;
    }

    .create-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(255,193,7,.2);
    }

    .create-btn:disabled {
      opacity: .5;

      cursor: not-allowed;

      transform: none;
    }


    /* ================= MESSAGE ================= */

    .message {
      display: none;

      padding: 12px;

      border-radius: 10px;

      margin-bottom: 15px;

      font-size: 13px;
    }

    .success {
      display: block;

      color: #63f39a;

      background:
        rgba(0,255,100,.08);

      border:
        1px solid rgba(0,255,100,.2);
    }

    .error {
      display: block;

      color: #ff7070;

      background:
        rgba(255,0,0,.08);

      border:
        1px solid rgba(255,0,0,.2);
    }


    /* ================= SEARCH ================= */

    .search-box {
      position: relative;
    }

    .search-icon {
      position: absolute;

      left: 14px;
      top: 12px;

      font-size: 18px;

      pointer-events: none;
    }

    .search-box input {
      padding-left: 43px;
    }

    .count {
      color: #888;

      font-size: 13px;

      margin-bottom: 15px;
    }


    /* ================= USERS ================= */

    .users {
      display: flex;

      flex-direction: column;

      gap: 10px;

      max-height: 520px;

      overflow-y: auto;

      padding-right: 4px;
    }

    .user {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 15px;

      border-radius: 13px;

      background:
        rgba(0,0,0,.35);

      border:
        1px solid rgba(255,255,255,.08);

      transition: .2s;
    }

    .user:hover {
      border-color:
        rgba(255,193,7,.25);

      background:
        rgba(255,193,7,.04);
    }

    .user-info {
      min-width: 0;

      flex: 1;
    }

    .email {
      color: white;

      font-weight: bold;

      word-break: break-all;

      font-size: 14px;
    }

    .status {
      color: #5bea8d;

      font-size: 12px;

      margin-top: 5px;
    }

    .role {
      color: #ffd54a;

      font-size: 12px;

      margin-top: 3px;
    }


    /* ================= DELETE ================= */

    .delete-btn {
      flex-shrink: 0;

      padding: 8px 11px;

      border-radius: 8px;

      border:
        1px solid #ff5555;

      background: transparent;

      color: #ff6b6b;

      cursor: pointer;

      transition: .2s;
    }

    .delete-btn:hover {
      background: #ff5555;

      color: white;
    }


    /* ================= EMPTY ================= */

    .empty {
      text-align: center;

      color: #777;

      padding: 35px 10px;

      line-height: 1.5;
    }


    /* ================= SCROLL ================= */

    .users::-webkit-scrollbar {
      width: 6px;
    }

    .users::-webkit-scrollbar-track {
      background: #111;

      border-radius: 10px;
    }

    .users::-webkit-scrollbar-thumb {
      background: #555;

      border-radius: 10px;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      body {
        padding: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      .users {
        max-height: 450px;
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .header {
        padding: 13px;

        border-radius: 16px;

        margin-bottom: 12px;
      }

      .header-left {
        gap: 9px;
      }

      .header-logo {
        width: 42px;
        height: 42px;

        min-width: 42px;

        border-radius: 12px;

        font-size: 21px;
      }

      .header h1 {
        font-size: 16px;
      }

      .header p {
        font-size: 10px;
      }

      .logout {
        padding: 8px 10px;

        font-size: 12px;
      }

      .grid {
        gap: 12px;
      }

      .card {
        padding: 17px;

        border-radius: 16px;
      }

      .card h2 {
        font-size: 17px;

        margin-bottom: 16px;
      }

      label {
        font-size: 12px;
      }

      input {
        padding: 13px;

        font-size: 14px;

        margin-bottom: 13px;
      }

      .create-btn {
        padding: 13px;

        font-size: 14px;
      }

      .user {
        padding: 12px;

        gap: 8px;
      }

      .email {
        font-size: 13px;
      }

      .status,
      .role {
        font-size: 11px;
      }

      .delete-btn {
        padding: 7px 9px;

        font-size: 12px;
      }

      .users {
        max-height: 400px;
      }
    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 400px) {

      .header {
        align-items: flex-start;
      }

      .header-left {
        max-width: 65%;
      }

      .header h1 {
        font-size: 14px;
      }

      .header p {
        font-size: 9px;
      }

      .logout {
        font-size: 11px;

        padding: 7px 9px;
      }

      .card {
        padding: 14px;
      }

      .card h2 {
        font-size: 16px;
      }

      .user {
        align-items: flex-start;
      }
    }

  </style>
</head>

  <!-- =====================================================

  <script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
  initializeApp,
  getApps,
  getApp
}
from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signOut
}
from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  deleteDoc,
  increment,
  serverTimestamp,
  query,
  where
}
from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyAW4JRvs_gwVHM1R8NJqfpB_toYIIZjWl0",

  authDomain:
    "authapp-e44f9.firebaseapp.com",

  projectId:
    "authapp-e44f9",

  storageBucket:
    "authapp-e44f9.firebasestorage.app",

  messagingSenderId:
    "102646770113",

  appId:
    "1:102646770113:web:1eeb323aa47269ac0a6740"

};


/* =====================================================
   MAIN APP
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   USERS ARRAY
===================================================== */

let allUsers = [];


/* =====================================================
   GENERATE 14 DIGIT ACCOUNT ID
===================================================== */

function generateAccountId() {

  let id = "";

  for (let i = 0; i < 14; i++) {
    id += Math.floor(Math.random() * 10);
  }

  return id;
}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers() {

  const usersList =
    document.getElementById("usersList");

  usersList.innerHTML = `
    <div class="empty">
      ⏳ Foydalanuvchilar yuklanmoqda...
    </div>
  `;

  try {

    const snapshot =
      await getDocs(
        collection(db, "users")
      );

    allUsers = [];

    snapshot.forEach((item) => {

      const data =
        item.data();

      allUsers.push({

        uid:
          item.id,
accountId:
  String(data.accountId || ""),
        email:
          data.email || "",

        role:
          String(data.role || "user")
            .trim()
            .toLowerCase(),

        status:
          data.status || "active",

        freeSpins:
          Number(data.freeSpins || 0),

        extraSpins:
          Number(data.extraSpins || 0)

      });

    });

    renderUsers(allUsers);

  } catch (error) {

    console.error(
      "LOAD USERS ERROR:",
      error
    );

    usersList.innerHTML = `
      <div class="empty">
        ❌ Foydalanuvchilarni yuklab bo‘lmadi.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}

const prizeAccountId =
    document.getElementById("prizeAccountId");

const findPrizesBtn =
    document.getElementById("findPrizesBtn");

const userPrizesList =
    document.getElementById("userPrizesList");


findPrizesBtn.addEventListener("click", async () => {

    const accountId =
        prizeAccountId.value.trim();

    if (!/^\d{14}$/.test(accountId)) {

        userPrizesList.innerHTML = `
            <div style="
                padding:15px;
                border-radius:12px;
                background:#3b1515;
                color:#ff8a8a;
            ">
                ❌ 14 xonali Account ID kiriting.
            </div>
        `;

        return;
    }


    userPrizesList.innerHTML = `
        <div style="padding:15px;">
            ⏳ Yutuqlar qidirilmoqda...
        </div>
    `;


    try {

        // Account ID orqali userni topamiz
        const usersQuery = query(
            collection(db, "users"),
            where("accountId", "==", accountId)
        );

        const usersSnapshot =
            await getDocs(usersQuery);


        if (usersSnapshot.empty) {

            userPrizesList.innerHTML = `
                <div style="
                    padding:15px;
                    border-radius:12px;
                    background:#3b1515;
                    color:#ff8a8a;
                ">
                    ❌ Bu Account ID topilmadi.
                </div>
            `;

            return;
        }


        const userDoc =
            usersSnapshot.docs[0];

        const uid = userDoc.id;


        // Shu userning yutuqlarini olamiz
        const prizesQuery = query(
            collection(db, "prizes"),
            where("userId", "==", uid)
        );

        const prizesSnapshot =
            await getDocs(prizesQuery);


        if (prizesSnapshot.empty) {

            userPrizesList.innerHTML = `
                <div style="
                    padding:20px;
                    text-align:center;
                    color:#999;
                ">
                    🏆 Hali yutuqlar yo‘q.
                </div>
            `;

            return;
        }


        userPrizesList.innerHTML = "";


        prizesSnapshot.forEach((prizeDoc) => {

            const prize =
                prizeDoc.data();

            const prizeId =
                prizeDoc.id;

            const isCompleted =
                prize.status === "completed";


            const item =
                document.createElement("div");

            item.style.cssText = `
                padding:18px;
                margin-bottom:12px;
                border-radius:16px;
                border:1px solid rgba(255,255,255,.1);
                background:rgba(255,255,255,.04);
            `;


            item.innerHTML = `

                <div style="
                    font-size:22px;
                    margin-bottom:8px;
                ">
                    ${prize.icon || "🏆"}
                </div>

                <div style="
                    font-weight:900;
                    color:#ffd84d;
                    margin-bottom:8px;
                ">
                    ${prize.name || "Yutuq"}
                </div>

                <div style="
                    margin-bottom:12px;
                    color:${isCompleted ? "#86efac" : "#fbbf24"};
                    font-weight:800;
                    font-size:12px;
                ">
                    ${
                        isCompleted
                        ? "✅ RASMIYLASHTIRILDI"
                        : "⏳ RASMIYLASHTIRILMAGAN"
                    }
                </div>

                ${
                    isCompleted
                    ? ""
                    : `
                        <button
                            class="complete-prize-btn"
                            data-id="${prizeId}"
                            style="
                                width:100%;
                                padding:12px;
                                border:0;
                                border-radius:12px;
                                background:linear-gradient(
                                    135deg,
                                    #22c55e,
                                    #16a34a
                                );
                                color:white;
                                font-weight:900;
                                cursor:pointer;
                            "
                        >
                            ✅ RASMIYLASHTIRILDI DEB BELGILASH
                        </button>
                    `
                }

            `;


            userPrizesList.appendChild(item);
        });


        // Rasmiylashtirish tugmalari
        document
            .querySelectorAll(".complete-prize-btn")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const prizeId =
                            button.dataset.id;

                        button.disabled = true;

                        button.innerHTML =
                            "⏳ Saqlanmoqda...";


                        try {

                            await updateDoc(
                                doc(
                                    db,
                                    "prizes",
                                    prizeId
                                ),
                                {
                                    status: "completed",
                                    completedAt:
                                        new Date()
                                }
                            );


                            button.parentElement
                                .querySelector(
                                    "div:nth-child(3)"
                                )
                                .innerHTML =
                                "✅ RASMIYLASHTIRILDI";

                            button.parentElement
                                .querySelector(
                                    "div:nth-child(3)"
                                ).style.color =
                                "#86efac";

                            button.remove();


                        } catch (error) {

                            console.error(error);

                            button.disabled =
                                false;

                            button.innerHTML =
                                "❌ Qayta urinib ko‘ring";

                        }

                    }
                );

            });


    } catch (error) {

        console.error(
            "Yutuqlarni olishda xato:",
            error
        );

        userPrizesList.innerHTML = `
            <div style="
                padding:15px;
                border-radius:12px;
                background:#3b1515;
                color:#ff8a8a;
            ">
                ❌ Xatolik yuz berdi.
            </div>
        `;
    }

});
/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(list) {

  const usersList =
    document.getElementById("usersList");

  const userCount =
    document.getElementById("userCount");

  usersList.innerHTML = "";

  userCount.textContent =
    list.length + " ta foydalanuvchi";


  if (list.length === 0) {

    usersList.innerHTML = `
      <div class="empty">
        🔎 Foydalanuvchi topilmadi
      </div>
    `;

    return;

  }


  list.forEach((user) => {

    const div =
      document.createElement("div");

    div.className = "user";


    const totalSpins =
      user.freeSpins +
      user.extraSpins;


    div.innerHTML = `

      <div class="user-info">

        <div class="email">

          📧
          ${escapeHTML(user.email)}

        </div>

        <div class="status">

          🟢
          ${escapeHTML(user.status)}

        </div>

        <div class="role">

          ${
            user.role === "admin" ||
            user.role === "owner"

              ? "👑 Admin"

              : "👤 Foydalanuvchi"
          }

        </div>

        <div
          style="
            color:#ffd54a;
            font-size:12px;
            margin-top:5px;
          "
        >

          🎯 Popitka:
          ${totalSpins}

          ${
            user.extraSpins > 0
              ? `(+${user.extraSpins} qo‘shilgan)`
              : ""
          }

        </div>

        <div
          style="
            color:#777;
            font-size:10px;
            margin-top:4px;
            word-break:break-all;
          "
        >
Account ID: ${escapeHTML(user.accountId)}

        </div>

      </div>


      ${
        user.role !== "admin" &&
        user.role !== "owner"

        ? `

          <button
            class="delete-btn"
            data-id="${escapeHTML(user.uid)}"
          >
            🗑️
          </button>

        `

        : ""

      }

    `;


    const deleteBtn =
      div.querySelector(".delete-btn");


    if (deleteBtn) {

      deleteBtn.addEventListener(
        "click",
        () => deleteUser(user.uid)
      );

    }


    usersList.appendChild(div);

  });

}

/* =====================================================
   ADD SPIN
===================================================== */

const addSpinForm =
  document.getElementById("addSpinForm");

const addSpinBtn =
  document.getElementById("addSpinBtn");

const spinMessage =
  document.getElementById("spinMessage");


addSpinForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    const accountId =
      document
        .getElementById("accountId")
        .value
        .trim();

    const amount =
      Number(
        document
          .getElementById("spinAmount")
          .value
      );

    spinMessage.style.display = "none";


    /* =========================
       ACCOUNT ID TEKSHIRISH
    ========================= */

    if (!/^\d{14}$/.test(accountId)) {

      showSpinMessage(
        "❌ Account ID aynan 14 xonali raqam bo‘lishi kerak.",
        "error"
      );

      return;
    }


    /* =========================
       POPITKA TEKSHIRISH
    ========================= */

    if (
      !Number.isInteger(amount) ||
      amount < 1
    ) {

      showSpinMessage(
        "❌ Popitka soni 1 yoki undan ko‘p bo‘lishi kerak.",
        "error"
      );

      return;
    }


    addSpinBtn.disabled = true;

    addSpinBtn.textContent =
      "⏳ Qo‘shilmoqda...";


    try {

      /* =========================
         ACCOUNT ID BO‘YICHA USER TOPISH
      ========================= */

      const usersRef =
        collection(db, "users");


      const q =
        query(
          usersRef,
          where("accountId", "==", accountId)
        );


      const snapshot =
        await getDocs(q);


      /* =========================
         USER TOPILMADI
      ========================= */

      if (snapshot.empty) {

        showSpinMessage(
          "❌ Bu Account ID topilmadi.",
          "error"
        );

        return;
      }


      /* =========================
         USER
      ========================= */

      const userDoc =
        snapshot.docs[0];

      const userRef =
        userDoc.ref;


      /* =========================
         POPITKA QO‘SHISH
      ========================= */

      await updateDoc(
        userRef,
        {
          extraSpins:
            increment(amount)
        }
      );


      /* =========================
         SUCCESS
      ========================= */

      showSpinMessage(

        `✅ ${amount} ta popitka qo‘shildi!`,

        "success"

      );


      /* =========================
         INPUT TOZALASH
      ========================= */

      document
        .getElementById("accountId")
        .value = "";

      document
        .getElementById("spinAmount")
        .value = "";


      /* =========================
         USERLARNI YANGILASH
      ========================= */

      await loadUsers();


    } catch (error) {

      console.error(
        "ADD SPIN ERROR:",
        error
      );


      showSpinMessage(

        "❌ Popitka qo‘shishda xatolik: " +
        error.message,

        "error"

      );


    } finally {

      addSpinBtn.disabled = false;

      addSpinBtn.textContent =
        "🎯 Popitka qo‘shish";

    }

  }
);

/* =====================================================
   DELETE USER
===================================================== */

async function deleteUser(uid) {

  const user =
    allUsers.find(
      item =>
        item.uid === uid
    );


  if (!user)
    return;


  const confirmDelete =
    confirm(

      user.email +
      " foydalanuvchisini o‘chirishni xohlaysizmi?"

    );


  if (!confirmDelete)
    return;


  try {

    await deleteDoc(

      doc(
        db,
        "users",
        uid
      )

    );


    await loadUsers();


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    alert(
      "❌ O‘chirishda xatolik: " +
      error.message
    );

  }

}

/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
